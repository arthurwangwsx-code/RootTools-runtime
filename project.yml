name: RootTools
options:
  bundleIdPrefix: com.arthur
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  RootTools:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthur.roottools.ios
        PRODUCT_NAME: RootTools
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Root Tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Release:
          # Keep optimized Release code, but do not force Swift whole-module
          # compilation. RootTools is edited frequently while a physical
          # device is attached; per-file optimized compilation is parallel and
          # incremental, whereas WMO rebuilt every SwiftUI source for one-line
          # changes and routinely took several minutes.
          SWIFT_COMPILATION_MODE: singlefile
          SWIFT_OPTIMIZATION_LEVEL: -O
          COMPILER_INDEX_STORE_ENABLE: NO

