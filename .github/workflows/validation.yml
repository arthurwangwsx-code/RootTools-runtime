name: RootTools Validation

on:
  workflow_dispatch:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene
        run: |
          git diff --check
          bash -n Scripts/*.sh
          python3 -m py_compile Scripts/*.py
          test ! -e .roottools-token
          test ! -e .roottools-agent-token

      - name: Explain full validation boundary
        run: |
          echo "Full iOS/daemon validation is intentionally local-only."
          echo "Run: bash Scripts/test.sh && bash Scripts/build.sh"
