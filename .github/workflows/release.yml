name: RootTools Release Metadata

# Release artifacts are intentionally built on the maintainer machine.
# GitHub Actions only validates release metadata and creates a release when
# artifacts are explicitly attached. This avoids consuming macOS runner
# minutes for every Swift/Xcode build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that already has local artifacts uploaded
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-release-input:
    runs-on: ubuntu-latest
    steps:
      - name: Explain local release flow
        run: |
          echo "Build locally with Scripts/release-local.sh"
          echo "Upload generated artifacts to this release tag"
